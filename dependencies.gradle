/*
 * Dependências do mod Forge 1.7.10 (projeto raiz). A convenção GTNH já põe Minecraft, Forge e o processador do
 * UniMixins. O OceanWaves não depende de nenhum outro mod em tempo de execução.
 */
dependencies {
    // A matemática pura, embutida no jar do mod (e assim visível aos plugins Bukkit no Crucible).
    // A variante jar é pedida explicitamente: os atributos do RFG casariam com várias.
    shadowImplementation(project(":core")) {
        attributes {
            attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
        }
    }

    testImplementation("org.junit.jupiter:junit-jupiter:5.10.2")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher:1.10.2")
}
